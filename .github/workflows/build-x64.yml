name: Build Banner File Manager (x64)

# 通用 x64 构建产物，可在 Bannerlator 容器中运行（x86-64 原生或 arm64ec wowbox64）

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package (统一构建脚本)
        run: bash scripts/build.sh pkg bfm-zh-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfm-zh-x64
          path: bfm-zh-x64.zip

      - name: Update nightly pre-release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build
          tag_name: nightly
          prerelease: true
          body: |
            Auto-built from commit ${{ github.sha }}.
            This is a pre-release for testing only.

            完整安装包（含 wfm.exe、libcdio.dll、7-Zip 便携版、安装.bat、卸载还原.bat）
          files: bfm-zh-x64.zip
          fail_on_unmatched_files: true
